# Configuracion del harness de bench-site (worker unificado: .harness/run_worker.py)

[project]
name = "bench-site"
base_branch = "main"

[template]
path = "E:\\IA\\harness-template"
version = "cfa6e4d"   # commit de la plantilla con el que se alineo este proyecto (para /sync)
stack = "web"

[sync]
skip = [".claude/skills"]   # las skills de este proyecto estan en espanol: /sync no debe sobrescribirlas

[workers.local]
url = "http://127.0.0.1:1235"   # 127.0.0.1, no localhost: localhost puede resolver a IPv6 y llegar a otro programa
model = "qwen3.8-27b"           # preferido: el que se carga si no hay ninguno cargado
fallback_model = "google/gemma-4-26b-a4b-qat"   # secundario: se usa si Qwen no se puede cargar
attempts = 3
max_output_tokens = 16000
strip_thinking = false
strip_thinking_attempts = 2   # intentos 1 y 2 sin razonamiento (mas rapido); el 3 con razonamiento

[scope]
protected = ["data/raw/**"]

[gates]
fast = ["npm test"]
full = ["npm test", "npm run build"]

[timing]
worker_minutes = 10
gate_minutes = 5
